[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "onet_engine"
version = "0.0.1"
description = "CRISP-DM data pipeline to generate ATS-optimized resumes using the ONET API."
authors = [
  { name = "olwordeaux" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["onet_engine"]
include = ["pyproject.toml", "onet_engine/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["onet_engine"]
force-sort-within-sections = true

